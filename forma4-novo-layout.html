<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA 4 | Fitness</title><meta name='theme-color' content='#f9fbf7'><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#ccece0,#fff0dc,#f7cbb9);color:#294039;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,main,nav{max-width:520px;margin:auto;background:#f9fbf7}header{padding:28px 22px 10px}header h1{color:#1f947b;font-size:27px;letter-spacing:-1px;margin:0}header small,.muted,small{color:#82958c}main{padding:18px 20px 110px;min-height:calc(100vh - 170px)}
h2{font-size:24px;letter-spacing:-.7px;margin:8px 0 17px}h3{margin:0 0 10px}.card{background:#fff;border:1px solid #e6eee7;box-shadow:0 8px 24px #1e5b4510;border-radius:22px;padding:18px;margin:13px 0}.card:first-of-type{background:linear-gradient(125deg,#d6eee4,#ffebdb)}
button{font:inherit;background:#2aa287;color:#fff;border:0;border-radius:13px;padding:11px 15px;font-weight:650;cursor:pointer}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #ffad8d}
input{font:inherit;border:1px solid #dce8e0;border-radius:10px;padding:9px;color:#28483c;background:#fff;max-width:125px}input[type=checkbox]{accent-color:#239e83}label{display:inline-flex;flex-direction:column;gap:4px;font-size:12px;color:#728b80;margin:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 10px max(13px,env(safe-area-inset-bottom));box-shadow:0 -8px 22px #1a493619;border-top:1px solid #e6eee8;background:#fffdf9}
nav button{background:transparent;color:#879c91;box-shadow:none;padding:10px 3px;font-size:11px}nav button.active{background:#e0f4e9;color:#16876e}
nav button:before{display:block;font-size:23px;margin-bottom:3px}nav button:nth-child(1):before{content:'⌂'}nav button:nth-child(2):before{content:'▣'}nav button:nth-child(3):before{content:'♧'}nav button:nth-child(4):before{content:'▥'}
img{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:#e9f4ec}a{color:#158e78!important}svg{width:100%;height:180px}
.hero{background:linear-gradient(120deg,#c6eadc,#fbe0cc);border-radius:25px;padding:25px;min-height:175px;position:relative;overflow:hidden}.hero:after{content:'✦';font-size:125px;color:#31a88825;position:absolute;right:5px;top:5px}.hero h2{max-width:250px;font-size:27px;line-height:1.15}.hero p{max-width:240px;font-size:13px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statgrid .card{margin:0}.statgrid strong{font-size:28px;color:#199a80;display:block}
@media(min-width:650px){body{padding:20px}header,main,nav{box-shadow:0 0 30px #234a3210}}
</style></head><body><header><h1>FORMA 4</h1><small>Treino • Nutrição • Evolução</small></header><main id="root"></main><nav><button data-tab='hoje' onclick="tab='hoje';render()">Hoje</button><button data-tab='treinos' onclick="tab='treinos';render()">Treinos</button><button data-tab='alimentacao' onclick="tab='alimentacao';render()">Alimentação</button><button data-tab='evolucao' onclick="tab='evolucao';render()">Evolução</button></nav><script>
const data={A:[['Supino reto com halteres',3,'8–10','Dumbbell-bench-press'],['Remada baixa fechada',3,'8–12','Seated-cable-row'],['Supino inclinado com halteres',3,'10–12','Incline-dumbbell-bench-press'],['Puxada frontal',3,'10–12','Lat-pulldown'],['Desenvolvimento de ombros',2,'10–12','Dumbbell-shoulder-press'],['Tríceps na polia',2,'12','Triceps-pushdown'],['Rosca direta',2,'10–12','Dumbbell-curl']],B:[['Leg press 45°',3,'8–12','Leg-press'],['Cadeira extensora',3,'10–12','Leg-extension'],['Cadeira flexora',3,'10–12','Seated-leg-curl'],['Elevação pélvica na máquina',3,'10–12','Hip-thrust'],['Panturrilha sentada',3,'12–15','Seated-calf-raise'],['Prancha abdominal',3,'30–45 s','Plank']],C:[['Puxada frontal neutra',3,'8–12','Close-grip-lat-pulldown'],['Supino inclinado na máquina',3,'8–12','Incline-bench-press'],['Remada articulada',3,'10–12','Machine-row'],['Elevação lateral',3,'12–15','Dumbbell-lateral-raise'],['Crucifixo na máquina',2,'12–15','Pec-deck'],['Rosca martelo',2,'10–12','Hammer-curl'],['Tríceps testa',2,'10–12','Lying-triceps-extension']],D:[['Agachamento no Smith',3,'8–10','Smith-machine-squat'],['Terra romeno com halteres',3,'8–12','Dumbbell-romanian-deadlift'],['Cadeira flexora',3,'10–12','Seated-leg-curl'],['Cadeira abdutora',2,'12–15','Hip-abduction'],['Panturrilha em pé',3,'12–15','Standing-calf-raise'],['Abdominal na máquina',3,'12–15','Machine-crunch']]};
let state=JSON.parse(localStorage.getItem('forma4')||'{}');state.logs??={};state.food??=[];state.weights??=[];state.goals??={kcal:2200,protein:150};let tab='hoje',selected='A',detail=-1;const save=()=>localStorage.setItem('forma4',JSON.stringify(state));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const root=document.getElementById('root');function render(){let html='';if(tab==='hoje'){let day=new Date().getDay(),t=({1:'A',2:'B',4:'C',5:'D'})[day];html=`<div class="hero"><h2>Sua melhor versão começa hoje.</h2><p>Treine com constância. Evolua no seu ritmo.</p><button onclick="tab='treinos';selected='${t||'A'}';render()">Começar treino →</button></div><h2 style="margin-top:24px">Olá! 👋</h2><div class="card"><small>SEU PLANO DE HOJE</small><h3 style="margin-top:9px">${t?'Treino '+t:'Dia de recuperação'}</h3><p>Seg A · Ter B · Qui C · Sex D</p><button onclick="tab='treinos';selected='${t||'A'}';render()">Ver exercícios →</button></div><h3 style="margin-top:23px">Seu progresso</h3><div class="statgrid"><div class="card"><strong>${Object.values(state.logs).filter(x=>x.done).length}</strong><small>Séries concluídas</small></div><div class="card"><strong>${state.weights.length}</strong><small>Pesagens</small></div></div><div class="card"><h3>Ações rápidas</h3><div class="row"><button onclick="tab='alimentacao';render()">＋ Refeição</button><button onclick="tab='evolucao';render()">＋ Peso</button></div></div>`}if(tab==='treinos'){html='<h2>Seus treinos</h2><div class="row">'+Object.keys(data).map(k=>`<button onclick="selected='${k}';detail=-1;render()">${k}</button>`).join('')+'</div><p class="muted">Sem caixotes, saltos ou subidas em bancos.</p>';html+=data[selected].map((e,i)=>`<div class="card"><div class="row"><b>${e[0]}</b><button onclick="detail=detail===${i}? -1:${i};render()">${detail===i?'Fechar':'Ver execução'}</button></div><p>${e[1]} séries · ${e[2]} repetições</p>${detail===i?`<img src="https://www.inspireusafoundation.org/wp-content/uploads/2022/11/${e[3].toLowerCase()}.gif" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" alt="Ilustração de ${e[0]}"><p class="muted" style="display:none">Imagem não disponível. Consulte uma demonstração profissional antes de executar.</p><p>Controle a fase de descida, mantenha alinhamento confortável, evite impulso e interrompa em caso de dor.</p><a style="color:#9deaba" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+' execução correta')}">Pesquisar demonstração em vídeo ↗</a><p><button onclick="startTimer(90)">Descanso 90s</button> <span id="timer"></span></p>`:''}${Array.from({length:e[1]},(_,s)=>{let id=`${today()}-${selected}-${i}-${s}`,v=state.logs[id]||{};return `<div class="row"><small>Série ${s+1}</small><label>kg <input type="number" min="0" step="0.5" value="${v.kg??''}" onchange="updateLog('${id}','kg',this.value)"></label><label>reps <input type="number" min="0" value="${v.reps??''}" onchange="updateLog('${id}','reps',this.value)"></label><label>✓ <input type="checkbox" ${v.done?'checked':''} onchange="updateLog('${id}','done',this.checked)"></label></div>`}).join('')}</div>`).join('')}if(tab==='alimentacao'){let f=state.food.filter(x=>x.date===today()),sum=k=>f.reduce((a,x)=>a+(+x[k]||0),0);html=`<h2>Alimentação</h2><div class="card"><b>Hoje</b><p>${sum('kcal')} / ${state.goals.kcal} kcal · ${sum('protein')} / ${state.goals.protein} g proteína</p><p>Carboidratos ${sum('carbs')}g · Gorduras ${sum('fat')}g</p><label>Meta kcal <input id="gk" type="number" value="${state.goals.kcal}"></label><label>Proteína g <input id="gp" type="number" value="${state.goals.protein}"></label><button onclick="state.goals={kcal:+gk.value,protein:+gp.value};save();render()">Salvar metas</button></div><div class="card"><h3>Adicionar alimento/refeição</h3><form onsubmit="addFood(event)"><p><input required name="name" placeholder="Alimento" style="max-width:90%"></p>${[['kcal','kcal'],['protein','Proteína g'],['carbs','Carboidratos g'],['fat','Gordura g']].map(([k,l])=>`<label>${l}<input type="number" min="0" step="0.1" name="${k}" required></label>`).join('')}<p><button>Adicionar</button></p></form></div>`+f.map(x=>`<div class="card row">${x.name} · ${x.kcal} kcal · ${x.protein}g proteína <button onclick="state.food=state.food.filter(a=>a.id!==${x.id});save();render()">Excluir</button></div>`).join('')}if(tab==='evolucao'){let ws=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date));html=`<h2>Controle de peso</h2><div class="card"><form onsubmit="addWeight(event)"><label>Data <input type="date" name="date" value="${today()}" required></label><label>Peso (kg) <input type="number" name="kg" step="0.1" min="20" required></label><label>Cintura (cm) <input type="number" name="waist" step="0.1" min="0"></label><button>Registrar</button></form></div>`;if(ws.length){let min=Math.min(...ws.map(x=>x.kg))-1,max=Math.max(...ws.map(x=>x.kg))+1;let points=ws.map((x,i)=>`${20+(i/(Math.max(1,ws.length-1)))*320},${155-(x.kg-min)/(max-min)*125}`).join(' ');html+=`<div class="card"><h3>Histórico do peso</h3><svg viewBox="0 0 360 180"><polyline fill="none" stroke="#91e8b3" stroke-width="3" points="${points}"/></svg><p>${ws[0].kg} kg → ${ws.at(-1).kg} kg (${(ws.at(-1).kg-ws[0].kg).toFixed(1)} kg)</p></div>`}html+=ws.slice().reverse().map(x=>`<div class="card row">${x.date} · ${x.kg} kg ${x.waist?'· cintura '+x.waist+' cm':''}<button onclick="state.weights=state.weights.filter(a=>a.id!==${x.id});save();render()">Excluir</button></div>`).join('');html+=`<div class="card"><button onclick="exportData()">Exportar dados JSON</button> <button onclick="if(confirm('Apagar todos os dados?')){localStorage.removeItem('forma4');location.reload()}">Apagar dados</button><p class="muted">Dados salvos somente neste navegador. Faça backups regularmente.</p></div>`}root.innerHTML=html;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}function updateLog(id,k,v){state.logs[id]??={};state.logs[id][k]=v;save()}function addFood(e){e.preventDefault();let f=new FormData(e.target);state.food.push({id:Date.now(),date:today(),name:f.get('name'),...Object.fromEntries(['kcal','protein','carbs','fat'].map(k=>[k,+f.get(k)]))});save();render()}function addWeight(e){e.preventDefault();let f=new FormData(e.target);state.weights.push({id:Date.now(),date:f.get('date'),kg:+f.get('kg'),waist:+f.get('waist')});save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='forma4-backup.json';a.click();URL.revokeObjectURL(a.href)}let timerInt;function startTimer(n){clearInterval(timerInt);let el=document.getElementById('timer');el.textContent=n+'s';timerInt=setInterval(()=>{n--;if(el)el.textContent=n+'s';if(n<=0)clearInterval(timerInt)},1000)}render();</script></body></html>
